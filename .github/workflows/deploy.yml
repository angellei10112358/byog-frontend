name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_BACKEND_RENDER: ${{ vars.VITE_BACKEND_RENDER }}
          VITE_BACKEND_RAILWAY: ${{ vars.VITE_BACKEND_RAILWAY }}
          VITE_BACKEND_GOOGLE: ${{ vars.VITE_BACKEND_GOOGLE }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
